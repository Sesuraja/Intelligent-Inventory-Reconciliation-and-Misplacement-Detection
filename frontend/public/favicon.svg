<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Radiating Left RFID Wave Arcs -->
  <path d="M 21 21 A 15.5 15.5 0 0 0 21 43" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" opacity="0.9" />
  <path d="M 15 15 A 24 24 0 0 0 15 49" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 9 9 A 32.5 32.5 0 0 0 9 55" stroke="#38BDF8" stroke-width="2.0" stroke-linecap="round" opacity="0.35" />

  <!-- Radiating Right RFID Wave Arcs -->
  <path d="M 43 21 A 15.5 15.5 0 0 1 43 43" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" opacity="0.9" />
  <path d="M 49 15 A 24 24 0 0 1 49 49" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 55 9 A 32.5 32.5 0 0 1 55 55" stroke="#38BDF8" stroke-width="2.0" stroke-linecap="round" opacity="0.35" />

  <!-- Center Smart RFID Chip Core -->
  <rect x="25" y="22" width="14" height="20" rx="3.5" fill="url(#cyanBlue)" filter="url(#glow)" />
  <rect x="27" y="24" width="10" height="16" rx="2" fill="#0B132B" />

  <!-- IC Chip Pins -->
  <line x1="22" y1="26" x2="25" y2="26" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="22" y1="32" x2="25" y2="32" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="22" y1="38" x2="25" y2="38" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

  <line x1="39" y1="26" x2="42" y2="26" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="39" y1="32" x2="42" y2="32" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="39" y1="38" x2="42" y2="38" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Center Activity Beacon Indicator -->
  <circle cx="32" cy="32" r="2.8" fill="url(#emeraldGrad)" filter="url(#glow)" />
</svg>
