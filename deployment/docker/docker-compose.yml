version: '3.8'

services:
  # ============================================================================
  # Service 1: PostgreSQL 16 Enterprise Warehouse Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: inventory_rfid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: inventory_rfid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_rfid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Service 2: Unified Web Application (FastAPI + React UI + WebSockets + AI)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_rfid_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects to PostgreSQL container service using psycopg
      DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@db:5432/inventory_rfid"
      SECRET_KEY: "rfid-ai-secret-key-super-secure-jwt-warehouse-2026"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/system/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local

