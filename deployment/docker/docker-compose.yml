version: '3.8'

services:
  # ============================================================================
  # Service 1: PostgreSQL 16 Enterprise Warehouse Database
  # Protected: Bound strictly to localhost loopback (127.0.0.1)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: inventory_rfid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_rfid}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-inventory_rfid}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Service 2: Unified Web Application (FastAPI + React UI + WebSockets + AI)
  # ============================================================================
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: inventory_rfid_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me_secure_db_pass}@db:5432/${POSTGRES_DB:-inventory_rfid}"
      JWT_SECRET: "${JWT_SECRET:-rfid-ai-secret-key-super-secure-jwt-warehouse-2026}"
      SECRET_KEY: "${JWT_SECRET:-rfid-ai-secret-key-super-secure-jwt-warehouse-2026}"
      OPERATING_MODE: "${OPERATING_MODE:-SIMULATION}"
      RFID_READER_HOST: "${RFID_READER_HOST:-192.168.1.100}"
      RFID_READER_PORT: "${RFID_READER_PORT:-5084}"
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/system/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    driver: local
